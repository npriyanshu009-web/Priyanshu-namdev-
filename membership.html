<!DOCTYPE html><html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Membership</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 350px;
      margin: 70px auto;
      padding: 30px 20px;
      background: #202020;
      border-radius: 18px;
      box-shadow: 0 0 20px #333;
    }
    h1 { color: #ffd700; }
    .price {
      font-size: 38px;
      font-weight: bold;
      margin: 25px 0;
    }
    button {
      background: #ffd700;
      color: black;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }
    p { color: #ddd; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👑 Premium Membership</h1>
    <p>Unlock all premium photos</p>
    <div class="price">₹20 <small>/ month</small></div>
    <p>✓ All photos access</p>
    <p>✓ 30 days membership</p>
    <button onclick="alert('Payment system abhi connect nahi hua hai.')">
      Join Now
    </button>
  </div>
</body>
</html>
